<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1233">
<title>Quiz NBA - Deviens une légende</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="topbar">
      <svg width="32" height="32" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="15" r="13" fill="#e8752a" stroke="#fdb927" stroke-width="1.5"/>
        <path d="M15 2 V28 M2 15 H28" stroke="#6b2f08" stroke-width="1.4"/>
        <path d="M4 6 Q15 15 4 24 M26 6 Q15 15 26 24" stroke="#6b2f08" stroke-width="1.4" fill="none"/>
      </svg>
      <div class="brand">Quiz NBA<small>Deviens une légende du basket</small></div>
      <div class="progress" id="prog" style="display:none">
        <span id="progtxt">Question 1 / 10</span>
        <div class="track"><i id="progbar"></i></div>
      </div>
      <button class="mute" id="mute" aria-label="Couper le son"></button>
    </div>
    <div class="body" id="view"></div>
  </div>
</div>
